<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0710">
  <title>Experiencia AR</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    :root {
      --brand: #DA2950;
      --bg: #0b0710;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    #ar { position: fixed; inset: 0; overflow: hidden; }
    body.demo { background: radial-gradient(120% 80% at 50% 100%, #3a0f22 0%, #140a1c 45%, #07050a 100%); }

    .layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 24px 16px; z-index: 10; }
    .hidden { display: none !important; }

    /* Pantalla de inicio */
    #start { background: radial-gradient(120% 80% at 50% 0%, #3a0f22 0%, #140a1c 50%, #07050a 100%); gap: 22px; }
    #start .logo { width: min(44vw, 180px); filter: drop-shadow(0 0 24px rgba(218, 41, 80, 0.6)); animation: pulse 1s ease-in-out infinite alternate; }
    #start h1 { font-size: clamp(24px, 7vw, 34px); line-height: 1.1; letter-spacing: -0.01em; }
    #start p { color: var(--muted); font-size: 16px; max-width: 320px; line-height: 1.45; }
    .steps { list-style: none; display: grid; gap: 8px; color: var(--muted); font-size: 15px; text-align: left; }
    .steps b { color: var(--text); display: inline-block; width: 22px; height: 22px; border-radius: 50%;
      background: var(--brand); text-align: center; line-height: 22px; font-size: 13px; margin-right: 8px; }
    .btn { appearance: none; border: 0; border-radius: 999px; background: var(--brand); color: #fff;
      font: 600 18px/1 inherit; padding: 18px 34px; min-width: 240px; cursor: pointer;
      box-shadow: 0 8px 30px rgba(218, 41, 80, 0.45); }
    .btn:active { transform: scale(0.97); }
    .link { background: none; border: 0; color: var(--muted); font: 14px inherit; text-decoration: underline; cursor: pointer; padding: 8px; }

    /* Cargando */
    #loading { background: rgba(7, 5, 10, 0.85); gap: 16px; }
    .spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--brand); animation: spin 0.9s linear infinite; }

    /* Guía para apuntar */
    #hint { pointer-events: none; background: transparent; gap: 18px; }
    #hint .frame { width: min(64vw, 280px); aspect-ratio: 1; border-radius: 28px; position: relative;
      display: grid; place-items: center; }
    #hint .frame::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
      border: 3px solid rgba(255, 255, 255, 0.9); animation: breathe 1.6s ease-in-out infinite; }
    #hint .frame img { width: 70%; opacity: 0.35; }
    #hint .scanline { position: absolute; left: 8%; right: 8%; height: 3px; border-radius: 3px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent); animation: scan 2s ease-in-out infinite; }
    #hint .msg { background: rgba(0, 0, 0, 0.55); padding: 10px 18px; border-radius: 999px; font-size: 16px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

    /* Error */
    #error { background: var(--bg); gap: 18px; }
    #error p { color: var(--muted); max-width: 320px; line-height: 1.45; }

    #debug { position: fixed; top: 10px; left: 10px; z-index: 20; background: rgba(0,0,0,0.6);
      font: 12px/1.2 ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; }
    #demo-badge { display: none; position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); z-index: 10; background: rgba(0,0,0,0.5); padding: 8px 14px; border-radius: 999px;
      font-size: 13px; color: var(--muted); width: max-content; max-width: calc(100% - 32px); text-align: center; }
    body.demo #demo-badge { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { transform: scale(0.97); } to { transform: scale(1.03); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.03); opacity: 1; } }
    @keyframes scan { 0%, 100% { top: 12%; } 50% { top: 86%; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="ar"></div>

  <section id="start" class="layer">
    <img class="logo" src="assets/logo.png" alt="Logo">
    <h1>Haz que el logo<br>cobre vida</h1>
    <ol class="steps">
      <li><b>1</b>Toca el botón y permite la cámara</li>
      <li><b>2</b>Apunta al logo</li>
      <li><b>3</b>Mueve el celular y mira la magia</li>
    </ol>
    <button id="start-btn" class="btn">Activar cámara</button>
    <button id="demo-btn" class="link">Ver demo sin cámara</button>
  </section>

  <section id="loading" class="layer hidden">
    <div class="spinner"></div>
    <p>Preparando la experiencia…</p>
  </section>

  <section id="hint" class="layer hidden">
    <div class="frame">
      <img src="assets/logo.png" alt="">
      <div class="scanline"></div>
    </div>
    <div class="msg">Apunta la cámara al logo</div>
  </section>

  <section id="error" class="layer hidden">
    <h2>Ups…</h2>
    <p id="error-msg"></p>
    <button class="btn" onclick="location.reload()">Intentar de nuevo</button>
  </section>

  <div id="debug" class="hidden"></div>
  <div id="demo-badge">Modo demo · mueve el dedo o inclina el celular · toca para ráfaga</div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
